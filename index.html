<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momentum — Personal Goal Execution System</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #0f1117;
        color: #e4e6ed;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
    <script>
      // Apply theme immediately to prevent flash
      (function() {
        try {
          var stored = localStorage.getItem('goal-execution-system');
          if (stored) {
            var data = JSON.parse(stored);
            if (data.state && data.state.theme === 'light') {
              // light mode - no class needed
            } else {
              document.documentElement.classList.add('dark');
            }
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
